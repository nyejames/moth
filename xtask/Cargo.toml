[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
moth = { path = "..", features = ["timers"] }
flate2 = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"

[dev-dependencies]
tempfile = "3"
