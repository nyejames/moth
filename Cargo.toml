[package]
name = "moth"
version = "0.1.12"
edition = "2024"

[workspace]
members = [".", "xtask"]
resolver = "2"

[features]
# Timer and developer-instrumentation features. `timers` enables the
# current-schema command/build/dev timing collector, final aggregate benchmark
# records and concise human summary; `detailed_timers` adds detailed AST
# substage timings; `benchmark_counters` enables
# high-volume local diagnostic counters, including direct counter output in a
# counter-only build and collector-backed counters when combined with
# `timers`. A build without `timers` performs no timer-system runtime work (see
# `just timers-erasure-check`).
timers = []
detailed_timers = ["timers"]
benchmark_counters = []
show_tokens = []
show_headers = []
show_ast = []
show_eval = []
show_hir = []
show_codegen = []
show_borrow_checker = []
boracle = []
checked_blocks = []
async_blocks = []

[[bin]]
name = "moth"
path = "src/main.rs"

[dependencies]
rayon = "1.12"
rustc-hash = "2.1.1"
saying = "0.1.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.2"
wasm-encoder = "0.247.0"
wasmparser = "0.247.0"
notify = "8.2.0"
ryu = "1.0.23"

# For future release builds:
# oxc_minifier = "0.115.0"

pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

# The canonical integration runner ships in the binary (`moth tests`) and its Node rendered-output
# harness needs an owned temporary workspace, so `tempfile` is a normal dependency rather than a
# dev-dependency. Tests use the same crate.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3  # Optimize dependencies in dev
