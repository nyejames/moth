name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BIN_NAME: moth
  PACKAGE_NAME: moth

jobs:
  validate:
    # Release keeps every standard gate, including the expensive release-artifact checks.
    name: Validate before release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml owns the exact Rust release; installing the active toolchain consumes
      # that pin without advancing it.
      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustc -vV
          cargo clippy -V
          cargo fmt --version

      # validate-full executes rendered JavaScript, so it uses the Node release pinned by .node-version.
      - name: Install repository Node runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Report Node runtime
        shell: bash
        run: node -p 'process.execPath + " " + process.version + " " + typeof Math.f16round'

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        timeout-minutes: 10
        run: cargo install just --locked

      - name: Run validation
        timeout-minutes: 30
        run: just validate-full

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: moth

          # Build Intel macOS from Apple Silicon to avoid macos-13 runner queue stalls.
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: moth

          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: moth

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: moth.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup target add "${{ matrix.target }}"

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Print build environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          rustc -Vv
          cargo -V
          rustup target list --installed
          xcodebuild -version || true

      - name: Build release binary
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --locked --release -p moth-cli --bin moth --target "${{ matrix.target }}" --verbose

      - name: Prepare package directory
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE_NAME="${BIN_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}"

          mkdir -p "package/${ARCHIVE_NAME}"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "package/${ARCHIVE_NAME}/${BIN_NAME}.exe"
          else
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "package/${ARCHIVE_NAME}/${BIN_NAME}"
            chmod +x "package/${ARCHIVE_NAME}/${BIN_NAME}"
          fi

          cp README.md "package/${ARCHIVE_NAME}/"
          cp LICENSE "package/${ARCHIVE_NAME}/" 2>/dev/null || true
          # Compiler-shipped package files (@html, @styles, @web/site and @web/* assets) live beside the binary.
          cp -R packages "package/${ARCHIVE_NAME}/packages"

      # Hide the checkout's packages so the packaged binary must read its own `packages/`.
      - name: Smoke test packaged layout
        shell: bash
        run: |
          set -euxo pipefail

          HOST_ARCH="$(uname -m)"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="${BIN_NAME}-${GITHUB_REF_NAME}-${TARGET}"

          if [[ "$TARGET" == "x86_64-apple-darwin" && "$HOST_ARCH" == "arm64" ]]; then
            echo "Skipping x86_64 macOS smoke test on arm64 host"
            exit 0
          fi

          MOTH="$PWD/package/${ARCHIVE_NAME}/${{ matrix.binary }}"
          "$MOTH" --version

          mv packages "$RUNNER_TEMP/checkout-packages"
          SITE="$RUNNER_TEMP/smoke-site"
          mkdir -p "$SITE"
          printf 'project #= (\n    name = "smoke",\n)\nhtml #= ()\n' > "$SITE/config.moth"
          cat > "$SITE/@entry.moth" <<'EOF'
          @html p
          @styles right
          @web/canvas as drawing_api
          @intro content as intro

          ~[:[intro]]
          ~[p, right: explicit imports]

          draw || -> String, Error!:
              element = drawing_api.get_canvas("game_canvas")!
              drawing ~= drawing_api.context_2d(element)!
              drawing_api.fill_rect(~drawing, 0.0, 0.0, 10.0, 10.0)
              return "drawn"
          ;

          status = draw() catch:
              then "unavailable"
          ;

          io.line([: [status]])
          EOF
          printf '[p, center: both providers]\n' > "$SITE/intro.mtf"

          "$MOTH" build "$SITE"
          grep -q "text-align: center;" "$SITE/_dev/index.html"
          grep -q "text-align: right;" "$SITE/_dev/index.html"
          test -s "$SITE/_dev/_moth/js/canvas.js"
          mv "$RUNNER_TEMP/checkout-packages" packages

      - name: Create tar.gz package
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE_NAME="${BIN_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -czf "${ARCHIVE_NAME}.tar.gz" -C package "${ARCHIVE_NAME}"

      - name: Create zip package
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ArchiveName = "${env:BIN_NAME}-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          Compress-Archive -Path "package/${ArchiveName}" -DestinationPath "${ArchiveName}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail

          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Moth ${GITHUB_REF_NAME}"
