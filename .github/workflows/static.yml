# Validation gates and GitHub Pages deployment.
#
# Every validation family is its own job so one failure never stops another from reporting. The
# workflow result is still failed when a blocking gate fails: only the Windows leg is non-blocking.
name: Validate and deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    # Each (gate, os) pair reports on its own. Windows is non-blocking: see
    # docs/src/developer-docs/style-guide/validation.mtf for the criteria that make it blocking.
    name: ${{ matrix.gate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        gate:
          - format
          - clippy
          - unit-tests
          - feature-matrix
          - integration
          - docs
          - benchmarks
          - scaling
          - timers-erasure
          - source-audit
          - first-party-deps
          - honesty-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml owns the exact Rust release and components. Installing the active
      # toolchain consumes that pin without advancing it. Avoid setup-action environment
      # defaults that silently turn incremental compilation off in CI.
      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustc -vV
          cargo clippy -V
          cargo fmt --version

      # Only these gates execute rendered JavaScript through Node. .node-version owns the exact
      # validation release; the compiler's own host requirement stays native Math.f16round.
      - name: Install repository Node runtime
        if: matrix.gate == 'unit-tests' || matrix.gate == 'feature-matrix' || matrix.gate == 'integration'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Report Node runtime
        if: matrix.gate == 'unit-tests' || matrix.gate == 'feature-matrix' || matrix.gate == 'integration'
        shell: bash
        run: node -p 'process.execPath + " " + process.version + " " + typeof Math.f16round'

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        timeout-minutes: 10
        run: cargo install just --locked

      - name: Run gate
        timeout-minutes: 45
        run: just ci-gate-${{ matrix.gate }}

      # Reports are review evidence, so they are uploaded whether the gate passed or failed.
      - name: Upload machine-readable reports
        if: always() && (matrix.gate == 'honesty-audit' || matrix.gate == 'integration' || matrix.gate == 'feature-matrix' || matrix.gate == 'first-party-deps')
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.gate }}-${{ matrix.os }}
          path: target/test-reports/
          if-no-files-found: warn

  deploy:
    # Deployment waits for every gate. A non-blocking Windows failure does not hold it back.
    # Manual dispatches from feature branches are validation-only; only `main` publishes Pages.
    if: github.ref == 'refs/heads/main'
    needs: gate

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustc -vV

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation release
        timeout-minutes: 20
        run: cargo run --quiet -- build docs --release

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/release'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
