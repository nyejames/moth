# Validation gates and GitHub Pages deployment.
#
# Every validation family is its own job so one failure never stops another from reporting. The
# workflow result is still failed when a blocking gate fails: only the Windows leg is non-blocking.
name: Validate and deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    # Each (gate, os) pair reports on its own. Windows is non-blocking: see
    # docs/src/developer-docs/style-guide/validation.mtf for the criteria that make it blocking.
    name: ${{ matrix.gate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        gate:
          - clippy
          - unit-tests
          - feature-matrix
          - integration
          - docs
          - benchmarks
          - timers-erasure
          - source-audit
          - honesty-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        timeout-minutes: 10
        run: cargo install just --locked

      - name: Run gate
        timeout-minutes: 45
        run: just ci-gate-${{ matrix.gate }}

      # Reports are review evidence, so they are uploaded whether the gate passed or failed.
      - name: Upload machine-readable reports
        if: always() && (matrix.gate == 'honesty-audit' || matrix.gate == 'integration' || matrix.gate == 'feature-matrix')
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.gate }}-${{ matrix.os }}
          path: target/test-reports/
          if-no-files-found: warn

  deploy:
    # Deployment waits for every gate. A non-blocking Windows failure does not hold it back.
    needs: gate

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation release
        timeout-minutes: 20
        run: cargo run --quiet -- build docs --release

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/release'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
