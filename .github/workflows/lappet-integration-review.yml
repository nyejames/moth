# Temporary branch-only review helper. Removed before the final PR tree.
name: Lappet integration review

on:
  push:
    branches: ["lappet/initial-crate-and-design"]
    paths:
      - ".github/workflows/lappet-integration-review.yml"
      - ".lappet-integrate.py"

permissions:
  contents: write

concurrency:
  group: lappet-initial-review
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lappet/initial-crate-and-design
          fetch-depth: 0
      - name: Apply reviewed integration changes on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "lappet/initial-crate-and-design"
          git merge-base --is-ancestor 0096b781b45e347dfd545ccf504a654a8e3767bf HEAD
          if test -f .lappet-integrate.py; then
            python .lappet-integrate.py
            git add -u
            git rm .lappet-integrate.py
            git diff --cached --check
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate Lappet workspace and documentation authorities; retire superseded package plan'
            git push origin HEAD:refs/heads/lappet/initial-crate-and-design
          fi
          mkdir -p "$RUNNER_TEMP/lappet-validation"
          git rev-parse HEAD | tee "$RUNNER_TEMP/lappet-validation/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/lappet-validation/tree.txt"
          git diff 0096b781b45e347dfd545ccf504a654a8e3767bf --stat > "$RUNNER_TEMP/lappet-validation/change-stat.txt"
      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustc -vV | tee "$RUNNER_TEMP/lappet-validation/rustc.txt"
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check workspace registration and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/lappet-validation/metadata.json"
          cargo check --locked -p lappet 2>&1 | tee "$RUNNER_TEMP/lappet-validation/lappet-check.log"
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/lappet-validation/format.log"
      - name: Check and build Moth documentation
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- check docs --terse 2>&1 | tee "$RUNNER_TEMP/lappet-validation/docs-check.log"
          cargo run --locked --quiet -- build docs --release 2>&1 | tee "$RUNNER_TEMP/lappet-validation/docs-build.log"
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lappet-validation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lappet-validation/
            docs/release/developer-docs/wasm-optimisation/
            docs/release/docs/lappet/
          retention-days: 3
          if-no-files-found: warn
