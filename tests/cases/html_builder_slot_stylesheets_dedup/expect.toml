entry = "."

# Stylesheet identity is the stable resource origin, never an authored spelling, rendered URL or
# content hash. Same-origin aliases and formatting whitespace emit one link; distinct origins
# with identical bytes stay separate. Nested routes render their own page-relative href.

[backends.html]
mode = "success"
warnings = "forbid"

[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = [
    "<link rel=\"stylesheet\" href=\"./styles/docs.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/a.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/b.css\">",
]
must_contain_in_order = [
    "<link rel=\"stylesheet\" href=\"./styles/docs.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/a.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/b.css\">",
]
must_contain_exactly_once = [
    "<link rel=\"stylesheet\" href=\"./styles/docs.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/a.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/b.css\">",
]

[[backends.html.artifact_assertions]]
path = "about/index.html"
kind = "html"
must_contain = ["<link rel=\"stylesheet\" href=\"./styles/docs.css\">"]
must_contain_exactly_once = ["rel=\"stylesheet\""]

[[backends.html.artifact_assertions]]
path = "styles/docs.css"
kind = "binary"

[[backends.html.artifact_assertions]]
path = "styles/a.css"
kind = "binary"

[[backends.html.artifact_assertions]]
path = "styles/b.css"
kind = "binary"

[[backends.html.artifact_assertions]]
path = "about/styles/docs.css"
kind = "binary"

[backends.html_wasm]
mode = "success"
warnings = "forbid"

[[backends.html_wasm.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = [
    "<link rel=\"stylesheet\" href=\"./styles/docs.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/a.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/b.css\">",
]
must_contain_in_order = [
    "<link rel=\"stylesheet\" href=\"./styles/docs.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/a.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/b.css\">",
]
must_contain_exactly_once = [
    "<link rel=\"stylesheet\" href=\"./styles/docs.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/a.css\">",
    "<link rel=\"stylesheet\" href=\"./styles/b.css\">",
]

[[backends.html_wasm.artifact_assertions]]
path = "about/index.html"
kind = "html"
must_contain = ["<link rel=\"stylesheet\" href=\"./styles/docs.css\">"]
must_contain_exactly_once = ["rel=\"stylesheet\""]

[[backends.html_wasm.artifact_assertions]]
path = "styles/docs.css"
kind = "binary"

[[backends.html_wasm.artifact_assertions]]
path = "styles/a.css"
kind = "binary"

[[backends.html_wasm.artifact_assertions]]
path = "styles/b.css"
kind = "binary"

[[backends.html_wasm.artifact_assertions]]
path = "about/styles/docs.css"
kind = "binary"
