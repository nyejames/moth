    "<span class='moth-code-function'>main</span>",
    "<span class='moth-code-comment'>// note</span>",
    "<span class='moth-code-string'>&quot;hi&quot;</span>",
    "<span class='moth-code-keyword'>SELECT</span>",
    "<span class='moth-code-function'>COUNT</span>",
    "<span class='moth-code-keyword'>WHERE</span>",
