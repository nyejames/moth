[[backends.html_wasm.artifact_assertions]]
path = "empty/index.html"
kind = "html"
must_contain = [
    "<html lang=\"\">",
    "<meta name=\"description\" content=\"\">",
    "<link rel=\"icon\" href=\"\">",
