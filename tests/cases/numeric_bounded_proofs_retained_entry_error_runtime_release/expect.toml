entry = "."

# Release keeps the proven mixed-width operations scalar and still retains the U32 overflow
# check that ends the run. The built-in Error reaches the entry contract, so the staged
# success fragment is never published.
[backends.html]
mode = "success"
flags = ["release"]
warnings = "forbid"
entry_error_code = 301
rendered_output_exact = ""

# Release keeps every ordinary call, so the Wasm capability gate rejects the same narrow U8 + I8
# sum as the debug profile. Pin that exact operation so an unrelated capability rejection cannot
# satisfy this case.
[backends.html_wasm]
mode = "failure"
flags = ["release"]
warnings = "forbid"
diagnostic_codes = ["MOTH-RULE-0064"]

[[backends.html_wasm.diagnostic_assertions]]
code = "MOTH-RULE-0064"
reason = "unsupported_backend_feature.checked_numeric_operations"
path = "input/@entry.moth"
line = 8
column = 17
