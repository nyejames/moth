entry = "."

[backends.html]
mode = "success"
warnings = "forbid"

[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain_in_order = [
    "<main> <div class=\"card\">hello</div>  styles= ./styles/card.css; </main>",
]

[[backends.html.artifact_assertions]]
path = "styles/card.css"
kind = "binary"

[backends.html_wasm]
mode = "success"
warnings = "forbid"

[[backends.html_wasm.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain_in_order = [
    "<main> <div class=\"card\">hello</div>  styles= ./styles/card.css; </main>",
]

[[backends.html_wasm.artifact_assertions]]
path = "styles/card.css"
kind = "binary"
