entry = "."

[backends.html]
mode = "success"
warnings = "forbid"
rendered_output_contains = ["wasm unreachable cast ignored"]
[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_not_contain = [
    "function __moth_cast_int_to_string(",
    "function __moth_cast_int(",
    "dead-handler-materialisation",
]


[backends.html_wasm]
mode = "success"
warnings = "forbid"
rendered_output_contains = ["wasm unreachable cast ignored"]

[[backends.html_wasm.artifact_assertions]]
path = "page.wasm"
kind = "wasm"
validate_wasm = true
must_export = ["memory", "moth_str_ptr", "moth_str_len", "moth_release", "moth_start", "moth_vec_new", "moth_vec_push", "moth_vec_len", "moth_vec_get"]
