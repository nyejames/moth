entry = "."

[backends.html]
mode = "success"
warnings = "forbid"

[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = ["Hello World", "entry"]

[backends.html_wasm]
mode = "success"
warnings = "forbid"

[[backends.html_wasm.artifact_assertions]]
path = "page.wasm"
kind = "wasm"
validate_wasm = true
must_export = ["memory", "moth_str_ptr", "moth_str_len", "moth_release", "moth_start", "moth_vec_new", "moth_vec_push", "moth_vec_len", "moth_vec_get"]

[[backends.html_wasm.artifact_assertions]]
path = "page.js"
kind = "js"
must_contain = ["__moth_instantiate_wasm", "instance.exports.moth_start()"]
must_contain_exactly_once = ["function __moth_instantiate_wasm("]
