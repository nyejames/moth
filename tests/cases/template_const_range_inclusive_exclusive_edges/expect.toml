numeric_profile = "Int64/Float32"

[backends.html]
mode = "success"
warnings = "forbid"

[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = ["excl-1;", "excl-2;", "incl-1;", "incl-2;", "incl-3;"]
must_not_contain = ["excl-3;", "float-exclusive-equal-", "float-inclusive-equal-3;"]

must_contain_exactly_once = ["float-inclusive-equal-2;"]
