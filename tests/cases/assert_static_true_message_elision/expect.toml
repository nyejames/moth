[backends.html]
mode = "success"
warnings = "forbid"
rendered_output_contains = ["assert_static_true_message_elision"]

[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_not_contain = ["__assert_message_0"]

[backends.html_wasm]
mode = "success"
warnings = "forbid"
rendered_output_contains = ["assert_static_true_message_elision"]

[[backends.html_wasm.artifact_assertions]]
path = "page.wasm"
kind = "wasm"
validate_wasm = true
must_export = ["memory", "moth_str_ptr", "moth_str_len", "moth_release", "moth_start"]
