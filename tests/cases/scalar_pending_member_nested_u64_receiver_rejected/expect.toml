entry = "."

# The nested argument must register its concrete U64 receiver for `count`, so the
# delayed unknown-member diagnostic reports the independently resolved U64
# receiver rather than the whole literal's I32 range or an infrastructure
# failure. The resolved receiver identity is part of this diagnostic contract.

[backends.html]
mode = "failure"
warnings = "forbid"
diagnostic_codes = ["MOTH-RULE-0048"]
message_contains = ["'U64'"]

[[backends.html.diagnostic_assertions]]
code = "MOTH-RULE-0048"
reason = "invalid_field_access.unknown_member"

[backends.html_wasm]
mode = "failure"
warnings = "forbid"
diagnostic_codes = ["MOTH-RULE-0048"]
message_contains = ["'U64'"]

[[backends.html_wasm.diagnostic_assertions]]
code = "MOTH-RULE-0048"
reason = "invalid_field_access.unknown_member"
