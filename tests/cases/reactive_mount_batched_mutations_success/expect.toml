entry = "."

[backends.html]
mode = "success"
warnings = "forbid"
rendered_output_exact = "reactive_mount_batched_mutations_success 3\nreactive_mount_batched_mutations_success 3"

[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = [
    "function __moth_reactive_schedule(sourceId)",
    "if (__moth_reactive_flush_scheduled)",
    "queueMicrotask(__moth_reactive_flush)",
]
must_contain_exactly_once = ["__moth_mount_template_fragment(el, moth_frags[i])"]

[backends.html_wasm]
mode = "failure"
warnings = "forbid"
diagnostic_codes = ["MOTH-RULE-0064"]

[[backends.html_wasm.diagnostic_assertions]]
