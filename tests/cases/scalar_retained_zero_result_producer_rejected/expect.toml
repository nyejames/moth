entry = "."

# The zero-success `touch(origin)` is retained because its I32 argument is still
# pending, and its `then` group is an inferred multi-bind slot. Retention must
# reach the ordinary source diagnostic for a value with no success slot, not
# panic while projecting the empty result list. The reason key is left to parent
# observation, and the code is asserted alone rather than guessing message
# wording. MOTH-TYPE-0001 is inferred from the zero-result call being typed as
# `none` at the receiver boundary; parent must confirm it by concrete observation.

[backends.html]
mode = "failure"
warnings = "forbid"
diagnostic_codes = ["MOTH-TYPE-0001"]

[backends.html_wasm]
mode = "failure"
warnings = "forbid"
diagnostic_codes = ["MOTH-TYPE-0001"]
