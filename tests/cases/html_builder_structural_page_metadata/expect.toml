entry = "."

[backends.html]
mode = "success"
warnings = "forbid"

# A reserved page-metadata constant may carry a resource piece. Once URL contexts
# are assigned, that string renders instead of being refused as not-yet-renderable.
[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = ["rel=\"icon\" href=\"./static/favicon.png\""]

[[backends.html.artifact_assertions]]
path = "static/favicon.png"
kind = "binary"
