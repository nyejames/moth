entry = "."

[backends.html]
mode = "success"
warnings = "forbid"

# A configured origin is applied to the site root exactly once, so pages served from a subfolder
# keep working without repeating the setting at every link.
[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = ["href=\"/caf%C3%A9%20docs/%2520/\"", "href=\"/caf%C3%A9%20docs/%2520/docs/\""]
must_not_contain = ["/caf%C3%A9%20docs/%2520/caf%C3%A9%20docs/%2520/", "href=\"/docs/\""]
