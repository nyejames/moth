entry = "."

[backends.html]
mode = "success"
warnings = "forbid"

[[backends.html.artifact_assertions]]
path = "index.html"
kind = "html"
must_contain = ["<canvas"]
must_not_contain = [
    "_moth/js/canvas.js",
    "_moth/js/glue/module-",
    "_moth/js/runtime/moth-runtime",
    "<script type=\"importmap\">",
]

[backends.html_wasm]
mode = "success"
warnings = "forbid"

[[backends.html_wasm.artifact_assertions]]
path = "page.wasm"
kind = "wasm"
validate_wasm = true
must_export = ["memory", "moth_str_ptr", "moth_str_len", "moth_release", "moth_start"]

