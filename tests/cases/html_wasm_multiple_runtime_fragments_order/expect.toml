entry = "."

[backends.html_wasm]
mode = "success"
warnings = "forbid"

[[backends.html_wasm.artifact_assertions]]
path = "page.wasm"
kind = "wasm"
validate_wasm = true
must_export = ["memory", "moth_str_ptr", "moth_str_len", "moth_release", "moth_start", "moth_vec_new", "moth_vec_push", "moth_vec_len", "moth_vec_get"]

[[backends.html_wasm.artifact_assertions]]
path = "page.js"
kind = "js"
must_contain_in_order = [
    "moth-slot-0",
    "moth-slot-1",
    "insertAdjacentHTML(\"beforeend\", moth_text)",
]
must_contain_exactly_once = ["function __moth_instantiate_wasm("]
