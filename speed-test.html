/*!
  MOTH CSS CORE (absolute basics CSS reset)
  This is inspired by Pico.css, but is an even more minimal reset.

  Actual style systems are intended to be built on top of this easily.
*/

:root {
  color-scheme: light dark;

  --moth-font-size: 100%;

  --moth-font-family-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";

  --moth-font-family: var(--moth-font-family-sans-serif);

  --moth-line-height: 1.5;
  --moth-font-weight: 400;
  --moth-font-size: 100%;
  --moth-text-underline-offset: 0.1rem;
  --moth-border-radius: 0.25rem;
  --moth-border-width: 0.0625rem;
  --moth-outline-width: 0.125rem;
  --moth-transition: 0.2s ease-in-out;

  --moth-spacing: 1rem;
  --moth-spacing-small: 0.5rem;

  /* Code block colours */
  --comment: #8e8e8e;
  --keyword: #fdbe82;
  --string: #64d721;
  --number: #c09eea;
  --operator: #a6a9fd;
  --struct: #fca1e7;
  --type: #46ceff;
  --parenthesis: #dece74;
}

/* where: is used here for less specificity, allowing easier overriding */
:where(:root) {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
  text-size-adjust: 100%;
  font-weight: var(--moth-font-weight);
  font-size: var(--moth-font-size);
  line-height: var(--moth-line-height);
  font-family: var(--moth-font-family);
  text-underline-offset: var(--moth-text-underline-offset);
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
  -moz-tab-size: 4;
  -o-tab-size: 4;
  tab-size: 4;

}

@media (min-width: 576px) {
  :root {
    --moth-font-size: 106.25%;
  }
}
@media (min-width: 768px) {
  :root {
    --moth-font-size: 112.5%;
  }
}
@media (min-width: 1024px) {
  :root {
    --moth-font-size: 118.75%;
  }
}
@media (min-width: 1280px) {
  :root {
    --moth-font-size: 125%;
  }
}
@media (min-width: 1536px) {
  :root {
    --moth-font-size: 131.25%;
  }
}

body {
  width: 100%;
  margin: 0;
}

/* Code Style */
.codeblock {
  color: hsla(0, 0%, 100%, 0.982);
  font-family: var(--moth-font-family-monospace);
  display: block;
  max-width: 100%;
  overflow-x: auto;
  white-space: pre;
  tab-size: 4;
}
.moth-code-comment {
  color: var(--comment);
}
.moth-code-keyword {
  color: var(--keyword);
}
.moth-code-string {
  color: var(--string);
}
.moth-code-number {
  color: var(--number);
}
.moth-code-operator {
  color: var(--operator);
}
.moth-code-struct {
  color: var(--struct);
}
.moth-code-type {
  color: var(--type);
}
.moth-code-parenthesis {
  color: var(--parenthesis);
}

/* BASIC CSS RESET STUFF */

/**
 * Document
 * Content-box & Responsive typography
*/
*,
*::before,
*::after {
  box-sizing: border-box;
  background-repeat: no-repeat;
}

::before,
::after {
  text-decoration: inherit;
  vertical-align: inherit;
}
